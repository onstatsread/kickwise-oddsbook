name: Check OddStorm Coverage

on:
  workflow_dispatch:

jobs:
  check_coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run OddStorm coverage check
        run: python check_oddstorm_coverage.py
