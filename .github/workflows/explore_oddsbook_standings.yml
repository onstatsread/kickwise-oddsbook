name: Explore Oddsbook Standings

on:
  workflow_dispatch:

jobs:
  explore_standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth
          playwright install --with-deps chromium
          playwright install --with-deps chrome

      - name: Run Oddsbook standings exploration
        run: python explore_oddsbook_standings.py
